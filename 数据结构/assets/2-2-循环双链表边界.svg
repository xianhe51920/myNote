<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480" role="img" aria-labelledby="title desc" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" fill="#7A3448">
  <title id="title">循环双链表：头结点不能删除</title>
  <desc id="desc">L 指向头结点；头结点不属于逻辑数据元素。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D66E8E" />
    </marker>
    <marker id="gray-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#B6A1A8" />
    </marker>
    <marker id="dark-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#7A3448" />
    </marker>
  </defs>
  <rect x="1" y="1" width="798" height="478" rx="18" fill="#FFFFFF" stroke="#E9A8BC" stroke-width="1.5" />
  <text x="28" y="36" font-size="26" fill="#7A3448" text-anchor="start" dominant-baseline="middle" font-weight="600">循环双链表：头结点不能删除</text>
  <text x="28" y="73" font-size="18" fill="#806A71" text-anchor="start" dominant-baseline="middle" font-weight="400">L 指向头结点；头结点不属于逻辑数据元素。</text>
  <rect x="80.0" y="161.0" width="100" height="58" rx="12" fill="#F8BBD0" stroke="#E9A8BC" stroke-width="2" />
  <text x="130" y="190" font-size="21" fill="#7A3448" text-anchor="middle" dominant-baseline="middle" font-weight="600">头 L</text>
  <rect x="340.0" y="161.0" width="100" height="58" rx="12" fill="#FFF6F8" stroke="#E9A8BC" stroke-width="2" />
  <text x="390" y="190" font-size="21" fill="#7A3448" text-anchor="middle" dominant-baseline="middle" font-weight="600">a₁</text>
  <rect x="600.0" y="161.0" width="100" height="58" rx="12" fill="#FFF6F8" stroke="#E9A8BC" stroke-width="2" />
  <text x="650" y="190" font-size="21" fill="#7A3448" text-anchor="middle" dominant-baseline="middle" font-weight="600">a₂</text>
  <line x1="180" y1="177" x2="340" y2="177" stroke="#D66E8E" stroke-width="2" fill="none" marker-end="url(#arrow)" />
  <line x1="340" y1="203" x2="180" y2="203" stroke="#D66E8E" stroke-width="2" fill="none" marker-end="url(#arrow)" />
  <line x1="440" y1="177" x2="600" y2="177" stroke="#D66E8E" stroke-width="2" fill="none" marker-end="url(#arrow)" />
  <line x1="600" y1="203" x2="440" y2="203" stroke="#D66E8E" stroke-width="2" fill="none" marker-end="url(#arrow)" />
  <path d="M700,185 C760,100 65,100 80,185" fill="none" stroke="#D66E8E" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="278.5" y="107" width="223.0" height="30" rx="4" fill="#FFFFFF" stroke="none" stroke-width="1.5" />
  <text x="390" y="122" font-size="18" fill="#7A3448" text-anchor="middle" dominant-baseline="middle" font-weight="400">尾结点的 next 指向头结点</text>
  <path d="M80,211 C45,300 755,300 700,211" fill="none" stroke="#D66E8E" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="276.0" y="262" width="228.0" height="30" rx="4" fill="#FFFFFF" stroke="none" stroke-width="1.5" />
  <text x="390" y="277" font-size="18" fill="#7A3448" text-anchor="middle" dominant-baseline="middle" font-weight="400">头结点的 prior 指向尾结点</text>
  <text x="35" y="340" font-size="21" fill="#806A71" text-anchor="start" dominant-baseline="middle" font-weight="400">p = 尾结点时，p.next == L，必须拒绝“删除后继”，否则会释放头结点。空</text>
  <text x="35" y="370" font-size="21" fill="#806A71" text-anchor="start" dominant-baseline="middle" font-weight="400">表中 L.next == L，也应拒绝删除。</text>
  <metadata>{"head": "L", "data": ["a1", "a2"], "delete_guard": "p.next != L", "empty": "L.next == L"}</metadata>
</svg>