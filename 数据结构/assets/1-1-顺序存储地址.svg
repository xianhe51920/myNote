<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 570" width="720" height="570" role="img" aria-labelledby="title desc" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" fill="#7A3448">
  <title id="title">顺序存储：位序与地址</title>
  <desc id="desc">位序从 1 开始；m = sizeof(ElemType)，不是固定的 4 字节。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D66E8E" />
    </marker>
    <marker id="gray-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#B6A1A8" />
    </marker>
    <marker id="dark-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#7A3448" />
    </marker>
  </defs>
  <rect x="1" y="1" width="718" height="568" rx="18" fill="#FFFFFF" stroke="#E9A8BC" stroke-width="1.5" />
  <text x="28" y="36" font-size="26" fill="#7A3448" text-anchor="start" dominant-baseline="middle" font-weight="600">顺序存储：位序与地址</text>
  <text x="28" y="73" font-size="18" fill="#806A71" text-anchor="start" dominant-baseline="middle" font-weight="400">位序从 1 开始；m = sizeof(ElemType)，不是固定的 4 字节。</text>
  <rect x="35" y="110" width="216" height="44" rx="5" fill="#F8BBD0" stroke="#E9A8BC" stroke-width="1.5" />
  <text x="143" y="132" font-size="21" fill="#7A3448" text-anchor="middle" dominant-baseline="middle" font-weight="600">元素位序</text>
  <rect x="251" y="110" width="216" height="44" rx="5" fill="#F8BBD0" stroke="#E9A8BC" stroke-width="1.5" />
  <text x="359" y="132" font-size="21" fill="#7A3448" text-anchor="middle" dominant-baseline="middle" font-weight="600">元素内容</text>
  <rect x="467" y="110" width="216" height="44" rx="5" fill="#F8BBD0" stroke="#E9A8BC" stroke-width="1.5" />
  <text x="575" y="132" font-size="21" fill="#7A3448" text-anchor="middle" dominant-baseline="middle" font-weight="600">起始地址</text>
  <rect x="35" y="154" width="216" height="52" rx="5" fill="#FFF6F8" stroke="#E9A8BC" stroke-width="1.5" />
  <text x="143" y="180" font-size="21" fill="#7A3448" text-anchor="middle" dominant-baseline="middle" font-weight="400">1</text>
  <rect x="251" y="154" width="216" height="52" rx="5" fill="#FFF6F8" stroke="#E9A8BC" stroke-width="1.5" />
  <text x="359" y="180" font-size="21" fill="#7A3448" text-anchor="middle" dominant-baseline="middle" font-weight="400">a₁</text>
  <rect x="467" y="154" width="216" height="52" rx="5" fill="#FFF6F8" stroke="#E9A8BC" stroke-width="1.5" />
  <text x="575" y="180" font-size="21" fill="#7A3448" text-anchor="middle" dominant-baseline="middle" font-weight="400">L₀</text>
  <rect x="35" y="206" width="216" height="52" rx="5" fill="#FFF6F8" stroke="#E9A8BC" stroke-width="1.5" />
  <text x="143" y="232" font-size="21" fill="#7A3448" text-anchor="middle" dominant-baseline="middle" font-weight="400">2</text>
  <rect x="251" y="206" width="216" height="52" rx="5" fill="#FFF6F8" stroke="#E9A8BC" stroke-width="1.5" />
  <text x="359" y="232" font-size="21" fill="#7A3448" text-anchor="middle" dominant-baseline="middle" font-weight="400">a₂</text>
  <rect x="467" y="206" width="216" height="52" rx="5" fill="#FFF6F8" stroke="#E9A8BC" stroke-width="1.5" />
  <text x="575" y="232" font-size="21" fill="#7A3448" text-anchor="middle" dominant-baseline="middle" font-weight="400">L₀ + m</text>
  <rect x="35" y="258" width="216" height="52" rx="5" fill="#FFF6F8" stroke="#E9A8BC" stroke-width="1.5" />
  <text x="143" y="284" font-size="21" fill="#7A3448" text-anchor="middle" dominant-baseline="middle" font-weight="400">3</text>
  <rect x="251" y="258" width="216" height="52" rx="5" fill="#FFF6F8" stroke="#E9A8BC" stroke-width="1.5" />
  <text x="359" y="284" font-size="21" fill="#7A3448" text-anchor="middle" dominant-baseline="middle" font-weight="400">a₃</text>
  <rect x="467" y="258" width="216" height="52" rx="5" fill="#FFF6F8" stroke="#E9A8BC" stroke-width="1.5" />
  <text x="575" y="284" font-size="21" fill="#7A3448" text-anchor="middle" dominant-baseline="middle" font-weight="400">L₀ + 2m</text>
  <rect x="35" y="310" width="216" height="52" rx="5" fill="#FFF6F8" stroke="#E9A8BC" stroke-width="1.5" />
  <text x="143" y="336" font-size="21" fill="#7A3448" text-anchor="middle" dominant-baseline="middle" font-weight="400">…</text>
  <rect x="251" y="310" width="216" height="52" rx="5" fill="#FFF6F8" stroke="#E9A8BC" stroke-width="1.5" />
  <text x="359" y="336" font-size="21" fill="#7A3448" text-anchor="middle" dominant-baseline="middle" font-weight="400">…</text>
  <rect x="467" y="310" width="216" height="52" rx="5" fill="#FFF6F8" stroke="#E9A8BC" stroke-width="1.5" />
  <text x="575" y="336" font-size="21" fill="#7A3448" text-anchor="middle" dominant-baseline="middle" font-weight="400">…</text>
  <rect x="35" y="362" width="216" height="52" rx="5" fill="#FFF6F8" stroke="#E9A8BC" stroke-width="1.5" />
  <text x="143" y="388" font-size="21" fill="#7A3448" text-anchor="middle" dominant-baseline="middle" font-weight="400">i</text>
  <rect x="251" y="362" width="216" height="52" rx="5" fill="#FFF6F8" stroke="#E9A8BC" stroke-width="1.5" />
  <text x="359" y="388" font-size="21" fill="#7A3448" text-anchor="middle" dominant-baseline="middle" font-weight="400">aᵢ</text>
  <rect x="467" y="362" width="216" height="52" rx="5" fill="#FFF6F8" stroke="#E9A8BC" stroke-width="1.5" />
  <text x="575" y="388" font-size="21" fill="#7A3448" text-anchor="middle" dominant-baseline="middle" font-weight="400">L₀ + (i−1)m</text>
  <rect x="35" y="414" width="216" height="52" rx="5" fill="#FFF6F8" stroke="#E9A8BC" stroke-width="1.5" />
  <text x="143" y="440" font-size="21" fill="#7A3448" text-anchor="middle" dominant-baseline="middle" font-weight="400">n</text>
  <rect x="251" y="414" width="216" height="52" rx="5" fill="#FFF6F8" stroke="#E9A8BC" stroke-width="1.5" />
  <text x="359" y="440" font-size="21" fill="#7A3448" text-anchor="middle" dominant-baseline="middle" font-weight="400">aₙ</text>
  <rect x="467" y="414" width="216" height="52" rx="5" fill="#FFF6F8" stroke="#E9A8BC" stroke-width="1.5" />
  <text x="575" y="440" font-size="21" fill="#7A3448" text-anchor="middle" dominant-baseline="middle" font-weight="400">L₀ + (n−1)m</text>
  <text x="35" y="509" font-size="19" fill="#806A71" text-anchor="start" dominant-baseline="middle" font-weight="400">第 i 个元素地址 = 首元素地址 + (i−1) × 元素大小。连续的是整个元素占用的</text>
  <text x="35" y="537" font-size="19" fill="#806A71" text-anchor="start" dominant-baseline="middle" font-weight="400">存储区。</text>
  <metadata>{"index_base": 1, "address_formula": "L0+(i-1)*sizeof(ElemType)"}</metadata>
</svg>