<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 330" font-family="sans-serif" font-size="13">
  <style>
    .hd { font-size: 13px; fill: #7A3448; text-anchor: middle; }
    .data { fill: #FFF6F8; stroke: #E9A8BC; stroke-width: 1.2; }
    .ptr { fill: #FFFFFF; stroke: #E9A8BC; stroke-width: 1.2; }
    .head { fill: #F8BBD0; stroke: #E9A8BC; stroke-width: 1.2; }
    .hnode { fill: #D66E8E; stroke: #A94A6B; stroke-width: 1; }
    .link { stroke: #D66E8E; stroke-width: 1.6; fill: none; marker-end: url(#arr); }
  </style>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><polygon points="0 0, 10 5, 0 10" fill="#D66E8E"/></marker>
  </defs>

  <!-- head pointer -->
  <rect x="30" y="12" width="70" height="28" class="head"/>
  <text class="hd" x="65" y="30">h = 1345</text>
  <line x1="65" y1="40" x2="95" y2="62" stroke="#D66E8E" stroke-width="1.4" marker-end="url(#arr)"/>

  <!-- node chain -->
  <!-- node1 -->
  <rect x="100" y="62" width="60" height="36" class="data"/><text x="130" y="84" text-anchor="middle">元素₁</text>
  <rect x="160" y="62" width="34" height="36" class="ptr"/><text x="177" y="84" text-anchor="middle">1400</text>
  <line x1="194" y1="80" x2="230" y2="80" class="link"/>
  <!-- node2 -->
  <rect x="230" y="62" width="60" height="36" class="data"/><text x="260" y="84" text-anchor="middle">元素₂</text>
  <rect x="290" y="62" width="34" height="36" class="ptr"/><text x="307" y="84" text-anchor="middle">1536</text>
  <line x1="324" y1="80" x2="360" y2="80" class="link"/>
  <!-- node3 -->
  <rect x="360" y="62" width="60" height="36" class="data"/><text x="390" y="84" text-anchor="middle">元素₃</text>
  <rect x="420" y="62" width="34" height="36" class="ptr"/><text x="437" y="84" text-anchor="middle">1346</text>
  <line x1="454" y1="80" x2="490" y2="80" class="link"/>
  <!-- node4 -->
  <rect x="490" y="62" width="60" height="36" class="data"/><text x="520" y="84" text-anchor="middle">元素₄</text>
  <rect x="550" y="62" width="34" height="36" class="ptr"/><text x="567" y="84" text-anchor="middle">Λ</text>

  <!-- table -->
  <rect x="30" y="130" width="200" height="30" class="head"/><text class="hd" x="130" y="150">存储地址</text>
  <rect x="235" y="130" width="200" height="30" class="head"/><text class="hd" x="335" y="150">存储内容</text>
  <rect x="440" y="130" width="150" height="30" class="head"/><text class="hd" x="515" y="150">指针</text>
  <!-- row1 -->
  <rect x="30" y="165" width="200" height="30" class="data"/><text class="hd" x="130" y="185">1345</text>
  <rect x="235" y="165" width="200" height="30" class="data"/><text class="hd" x="335" y="185">元素₁</text>
  <rect x="440" y="165" width="150" height="30" class="data"/><text class="hd" x="515" y="185">1400</text>
  <!-- row2 -->
  <rect x="30" y="200" width="200" height="30" class="data"/><text class="hd" x="130" y="220">1346</text>
  <rect x="235" y="200" width="200" height="30" class="data"/><text class="hd" x="335" y="220">元素₄</text>
  <rect x="440" y="200" width="150" height="30" class="data"/><text class="hd" x="515" y="220">Λ</text>
  <!-- row3 -->
  <rect x="30" y="235" width="200" height="30" class="data"/><text class="hd" x="130" y="255">……</text>
  <rect x="235" y="235" width="200" height="30" class="data"/><text class="hd" x="335" y="255">……</text>
  <rect x="440" y="235" width="150" height="30" class="data"/><text class="hd" x="515" y="255">……</text>
  <!-- row4 -->
  <rect x="30" y="270" width="200" height="30" class="data"/><text class="hd" x="130" y="290">1400</text>
  <rect x="235" y="270" width="200" height="30" class="data"/><text class="hd" x="335" y="290">元素₂</text>
  <rect x="440" y="270" width="150" height="30" class="data"/><text class="hd" x="515" y="290">1536</text>
  <!-- row5 -->
  <rect x="30" y="305" width="200" height="30" class="data"/><text class="hd" x="130" y="325">1536</text>
  <rect x="235" y="305" width="200" height="30" class="data"/><text class="hd" x="335" y="325">元素₃</text>
  <rect x="440" y="305" width="150" height="30" class="data"/><text class="hd" x="515" y="325">1346</text>
</svg>
