<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title"><title id="title">薄膜反射：光程差与反射相位跃变</title><defs><marker id="axis" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#526D83"/></marker><marker id="main" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#346E9D"/></marker></defs><rect x="0" y="0" width="960" height="540" fill="#E8EFF5"/><g font-family="Microsoft YaHei, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<text x="26" y="39" font-size="24" fill="#243E56" font-weight="700">薄膜反射：光程差与反射相位跃变</text>
<rect x="70" y="210" width="820" height="155" rx="0" fill="#D6E5F0" stroke="#B7CBDC"/>
<text x="790" y="180" font-size="24" fill="#243E56">n₁</text>
<text x="790" y="295" font-size="24" fill="#243E56">n₂</text>
<text x="790" y="405" font-size="24" fill="#243E56">n₃</text>
<line x1="150.000" y1="95.000" x2="300.000" y2="210.000" stroke="#346E9D" stroke-width="3" marker-end="url(#main)"/>
<line x1="300.000" y1="210.000" x2="450.000" y2="95.000" stroke="#346E9D" stroke-width="3" marker-end="url(#main)"/>
<line x1="300.000" y1="210.000" x2="410.000" y2="365.000" stroke="#6B9CBE" stroke-width="3" marker-end="url(#axis)"/>
<line x1="410.000" y1="365.000" x2="520.000" y2="210.000" stroke="#6B9CBE" stroke-width="3" marker-end="url(#axis)"/>
<line x1="520.000" y1="210.000" x2="670.000" y2="95.000" stroke="#6B9CBE" stroke-width="3" marker-end="url(#axis)"/>
<line x1="300.000" y1="140.000" x2="300.000" y2="310.000" stroke="#526D83" stroke-width="1.4" stroke-dasharray="6 5"/>
<text x="320" y="280" font-size="21" fill="#243E56">r</text>
<line x1="730.000" y1="210.000" x2="730.000" y2="365.000" stroke="#526D83" stroke-width="2"/>
<text x="744" y="295" font-size="22" fill="#243E56">e</text>
<text x="433" y="80" font-size="22" fill="#243E56">①</text>
<text x="665" y="80" font-size="22" fill="#243E56">②</text>
<text x="35" y="452" font-size="23" fill="#243E56">传播光程差：2n₂e cos r（λ 为真空波长）。</text>
<text x="35" y="490" font-size="22" fill="#243E56">仅有一次 π 相位跃变时：等效光程差再加 λ/2。</text>
<text x="35" y="524" font-size="18" fill="#5E7488">从低折射率向高折射率介质反射：发生半波损失；两次则相对抵消。</text>
</g></svg>