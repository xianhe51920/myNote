  <text class="label" x="108" y="140" text-anchor="middle">0.4</text>
  <line x1="180" y1="120" x2="180" y2="126" stroke="#333"/>
  <text class="label" x="180" y="140" text-anchor="middle">1</text>
  <line x1="240" y1="120" x2="240" y2="126" stroke="#333"/>
  <text class="label" x="240" y="140" text-anchor="middle">1.5</text>
  <line x1="300" y1="120" x2="300" y2="126" stroke="#333"/>
  <text class="label" x="300" y="140" text-anchor="middle">2</text>
  <!-- curve: x = 0.10 cos(5π/6 t - π/3) m, t in [0,2] -->
  <path class="curve" d="M 60,75 L 62.4,71 L 64.8,67.1 L 67.2,63.4 L 69.6,59.8 L 72,56.4 L 74.4,53.1 L 76.8,50.1 L 79.2,47.2 L 81.6,44.5 L 84,42.1 L 86.4,39.8 L 88.8,37.8 L 91.2,36 L 93.6,34.4 L 96,33.1 L 98.4,32 L 100.8,31.1 L 103.2,30.5 L 105.6,30.1 L 108,30 L 110.4,30.1 L 112.8,30.5 L 115.2,31.1 L 117.6,32 L 120,33.1 L 122.4,34.4 L 124.8,36 L 127.2,37.8 L 129.6,39.8 L 132,42.1 L 134.4,44.5 L 136.8,47.2 L 139.2,50.1 L 141.6,53.1 L 144,56.4 L 146.4,59.8 L 148.8,63.4 L 151.2,67.1 L 153.6,71 L 156,75 L 158.4,79.1 L 160.8,83.4 L 163.2,87.7 L 165.6,92.2 L 168,96.7 L 170.4,101.3 L 172.8,105.9 L 175.2,110.6 L 177.6,115.3 L 180,120 L 182.4,124.7 L 184.8,129.4 L 187.2,134.1 L 189.6,138.7 L 192,143.3 L 194.4,147.8 L 196.8,152.3 L 199.2,156.6 L 201.6,160.9 L 204,165 L 206.4,169 L 208.8,172.9 L 211.2,176.6 L 213.6,180.2 L 216,183.6 L 218.4,186.9 L 220.8,189.9 L 223.2,192.8 L 225.6,195.5 L 228,197.9 L 230.4,200.2 L 232.8,202.2 L 235.2,204 L 237.6,205.6 L 240,206.9 L 242.4,208 L 244.8,208.9 L 247.2,209.5 L 249.6,209.9 L 252,210 L 254.4,209.9 L 256.8,209.5 L 259.2,208.9 L 261.6,208 L 264,206.9 L 266.4,205.6 L 268.8,204 L 271.2,202.2 L 273.6,200.2 L 276,197.9 L 278.4,195.5 L 280.8,192.8 L 283.2,189.9 L 285.6,186.9 L 288,183.6 L 290.4,180.2 L 292.8,176.6 L 295.2,172.9 L 297.6,169 L 300,165"/>
  <!-- start t=0, x=0.05 -->
  <circle cx="60" cy="75" r="2.5" class="pt"/>
  <!-- peak P at t=0.4, x=0.10 -->
  <circle cx="108" cy="30" r="3" class="pt"/>
  <line x1="108" y1="30" x2="108" y2="120" class="dash"/>
  <text class="label" x="116" y="26" text-anchor="start">P</text>
  <!-- zero crossing t=1 -->
  <circle cx="180" cy="120" r="2" class="pt"/>
</svg>
