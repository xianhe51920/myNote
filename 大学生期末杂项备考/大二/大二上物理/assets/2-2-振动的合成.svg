<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 440" font-family="sans-serif" font-size="13">
  <style>
    .label { font-size: 13px; fill: #222; }
    .axis { stroke: #333; stroke-width: 1.2; fill: none; }
    .circ { fill: none; stroke: #333; stroke-width: 1; }
    .v1 { stroke: #2c3e50; stroke-width: 2.2; fill: none; marker-end: url(#a1); }
    .v2 { stroke: #c0392b; stroke-width: 2.4; fill: none; marker-end: url(#a2); }
    .note { font-size: 13px; fill: #c0392b; }
  </style>
  <defs>
    <marker id="ax" markerWidth="11" markerHeight="11" refX="8" refY="5.5" orient="auto"><polygon points="0 0, 11 5.5, 0 11" fill="#333"/></marker>
    <marker id="a1" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><polygon points="0 0, 10 5, 0 10" fill="#2c3e50"/></marker>
    <marker id="a2" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><polygon points="0 0, 11 5.5, 0 11" fill="#c0392b"/></marker>
  </defs>
  <line x1="75" y1="220" x2="400" y2="220" class="axis" marker-end="url(#ax)"/>
  <line x1="220" y1="412" x2="220" y2="50" class="axis" marker-end="url(#ax)"/>
  <text class="label" x="406" y="224">x</text>
  <text class="label" x="228" y="58">y</text>
  <circle cx="220" cy="220" r="130" class="circ"/>
  <line x1="220" y1="220" x2="259" y2="152" class="v1"/>
  <text class="label" x="300" y="88" text-anchor="start">A₁ = 0.03</text>
  <text class="label" x="300" y="108" text-anchor="start">φ = π/3</text>
  <line x1="220" y1="220" x2="155" y2="333" class="v2"/>
  <text class="note" x="86" y="376" text-anchor="start">A₂ = 0.05</text>
  <text class="note" x="86" y="396" text-anchor="start">φ = −2π/3</text>
</svg>
