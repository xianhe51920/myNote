<svg xmlns="http://www.w3.org/2000/svg" width="700" height="550" viewBox="0 0 700 550" role="img" aria-labelledby="title"><title id="title">同频振动合成：相位差为 π</title><defs><marker id="axis" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#526D83"/></marker><marker id="main" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#346E9D"/></marker></defs><rect x="0" y="0" width="700" height="550" fill="#E8EFF5"/><g font-family="Microsoft YaHei, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<text x="26" y="39" font-size="24" fill="#243E56" font-weight="700">同频振动合成：相位差为 π</text>
<line x1="90.000" y1="275.000" x2="595.000" y2="275.000" stroke="#526D83" stroke-width="1.8" marker-end="url(#axis)"/>
<line x1="330.000" y1="475.000" x2="330.000" y2="77.000" stroke="#526D83" stroke-width="1.8" marker-end="url(#axis)"/>
<text x="607" y="282" font-size="22" fill="#243E56">x</text>
<text x="342" y="88" font-size="22" fill="#243E56">y</text>
<line x1="330.000" y1="275.000" x2="381.000" y2="186.665" stroke="#6B9CBE" stroke-width="2.2" marker-end="url(#axis)"/>
<line x1="330.000" y1="275.000" x2="245.000" y2="422.224" stroke="#6B9CBE" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#axis)"/>
<line x1="330.000" y1="275.000" x2="296.000" y2="333.890" stroke="#346E9D" stroke-width="4" marker-end="url(#main)"/>
<text x="395" y="176" font-size="22" fill="#243E56">A₁ = 0.03 m</text>
<text x="395" y="205" font-size="20" fill="#5E7488">φ₁ = π/3</text>
<text x="96" y="449" font-size="22" fill="#243E56">A₂ = 0.05 m</text>
<text x="385" y="358" font-size="22" fill="#243E56">合成 A = 0.02 m</text>
<text x="385" y="388" font-size="21" fill="#243E56">φ = −2π/3</text>
<text x="30" y="520" font-size="21" fill="#243E56">两矢量反向：合成振幅为差值，方向随较长矢量。</text>
</g></svg>