<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" role="img" aria-labelledby="title"><title id="title">分段分布：先读清纵轴是 Nf(v)</title><defs><marker id="axis" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#526D83"/></marker><marker id="main" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#346E9D"/></marker></defs><rect x="0" y="0" width="900" height="460" fill="#E8EFF5"/><g font-family="Microsoft YaHei, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<text x="26" y="39" font-size="24" fill="#243E56" font-weight="700">分段分布：先读清纵轴是 Nf(v)</text>
<line x1="100.000" y1="325.000" x2="770.000" y2="325.000" stroke="#526D83" stroke-width="2" marker-end="url(#axis)"/>
<line x1="100.000" y1="325.000" x2="100.000" y2="110.000" stroke="#526D83" stroke-width="2" marker-end="url(#axis)"/>
<text x="778" y="332" font-size="19" fill="#243E56">v</text>
<text x="88" y="94" font-size="19" fill="#243E56">Nf(v)</text>
<rect x="540" y="145" width="140" height="180" rx="0" fill="#D6E5F0" stroke="#D6E5F0"/>
<polyline points="120.000,325.000 400.000,145.000 680.000,145.000 680.000,325.000" fill="none" stroke="#346E9D" stroke-width="3"/>
<text x="120" y="360" font-size="21" fill="#243E56" text-anchor="middle">0</text>
<text x="400" y="360" font-size="21" fill="#243E56" text-anchor="middle">v₀</text>
<text x="540" y="360" font-size="21" fill="#243E56" text-anchor="middle">1.5v₀</text>
<text x="680" y="360" font-size="21" fill="#243E56" text-anchor="middle">2v₀</text>
<line x1="100.000" y1="145.000" x2="680.000" y2="145.000" stroke="#6B9CBE" stroke-width="1" stroke-dasharray="5 5"/>
<text x="72" y="153" font-size="22" fill="#243E56">a</text>
<text x="535" y="123" font-size="20" fill="#243E56">阴影面积 = N/3</text>
<text x="30" y="407" font-size="24" fill="#243E56">总面积 = av₀/2 + av₀ = N；a = 2N/(3v₀)。</text>
<text x="30" y="447" font-size="21" fill="#243E56">若改画 f(v)，纵轴和全部面积都应除以 N。</text>
</g></svg>