  <text class="note" x="250" y="82" text-anchor="start">E_p = ½kA²</text>
  <line x1="45" y1="170" x2="45" y2="230" class="wall"/>
  <line x1="45" y1="176" x2="31" y2="176" stroke="#333" stroke-width="1.4"/>
  <line x1="45" y1="186" x2="31" y2="186" stroke="#333" stroke-width="1.4"/>
  <line x1="45" y1="196" x2="31" y2="196" stroke="#333" stroke-width="1.4"/>
  <line x1="45" y1="206" x2="31" y2="206" stroke="#333" stroke-width="1.4"/>
  <line x1="45" y1="216" x2="31" y2="216" stroke="#333" stroke-width="1.4"/>
  <line x1="45" y1="226" x2="31" y2="226" stroke="#333" stroke-width="1.4"/>
  <polyline class="spring" points="45,200 59.3,193 73.6,207 87.9,193 102.1,207 116.4,193 130.7,207 145,193 159.3,207 173.6,193 187.9,207 202.1,193 216.4,207 230.7,193 245,200"/>
