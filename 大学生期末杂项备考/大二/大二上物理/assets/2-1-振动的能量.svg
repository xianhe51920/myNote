  <polyline class="spring" points="45,70 53.8,63 62.5,77 71.2,63 80,77 88.8,63 97.5,77 106.2,63 115,77 123.8,63 132.5,77 141.2,63 150,70"/>
  <rect x="150" y="48" width="60" height="44" class="block"/>
