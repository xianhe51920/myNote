    .block { fill: #f3c623; stroke: #b8881a; stroke-width: 1.2; }
    .note { font-size: 13px; fill: #c0392b; }
  </style>
  <line x1="45" y1="40" x2="45" y2="100" class="wall"/>
  <line x1="45" y1="46" x2="31" y2="46" stroke="#333" stroke-width="1.4"/>
