  <text class="label" x="275" y="205" text-anchor="middle">m</text>
  <text class="note" x="345" y="188" text-anchor="start">E_k = ½kA²</text>
  <text class="note" x="345" y="212" text-anchor="start">E_p = 0</text>
  <text class="note" x="350" y="272" text-anchor="middle">E总 = ½kA² （机械能守恒，不变）</text>
