<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img" aria-labelledby="title"><title id="title">三片偏振片：逐片使用相邻透振方向夹角</title><defs><marker id="axis" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#526D83"/></marker><marker id="main" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#346E9D"/></marker></defs><rect x="0" y="0" width="1000" height="440" fill="#E8EFF5"/><g font-family="Microsoft YaHei, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<text x="26" y="39" font-size="24" fill="#243E56" font-weight="700">三片偏振片：逐片使用相邻透振方向夹角</text>
<rect x="195" y="130" width="130" height="175" rx="8" fill="#F3F7FA" stroke="#B7CBDC"/>
<line x1="260.000" y1="270.000" x2="260.000" y2="160.000" stroke="#346E9D" stroke-width="4"/>
<text x="260" y="110" font-size="23" fill="#243E56" text-anchor="middle">P₁：0°</text>
<text x="365" y="340" font-size="23" fill="#243E56" text-anchor="middle">I₀/2</text>
<rect x="445" y="130" width="130" height="175" rx="8" fill="#F3F7FA" stroke="#B7CBDC"/>
<line x1="471.109" y1="253.891" x2="548.891" y2="176.109" stroke="#346E9D" stroke-width="4"/>
<text x="510" y="110" font-size="23" fill="#243E56" text-anchor="middle">P₂：45°</text>
<text x="615" y="340" font-size="23" fill="#243E56" text-anchor="middle">I₀/4</text>
<rect x="695" y="130" width="130" height="175" rx="8" fill="#F3F7FA" stroke="#B7CBDC"/>
<line x1="705.000" y1="215.000" x2="815.000" y2="215.000" stroke="#346E9D" stroke-width="4"/>
<text x="760" y="110" font-size="23" fill="#243E56" text-anchor="middle">P₃：90°</text>
<text x="865" y="340" font-size="23" fill="#243E56" text-anchor="middle">I₀/8</text>
<line x1="70.000" y1="215.000" x2="185.000" y2="215.000" stroke="#346E9D" stroke-width="3" marker-end="url(#main)"/>
<text x="60" y="175" font-size="20" fill="#243E56">自然光 I₀</text>
<line x1="335.000" y1="215.000" x2="435.000" y2="215.000" stroke="#346E9D" stroke-width="3" marker-end="url(#main)"/>
<line x1="585.000" y1="215.000" x2="685.000" y2="215.000" stroke="#346E9D" stroke-width="3" marker-end="url(#main)"/>
<line x1="835.000" y1="215.000" x2="925.000" y2="215.000" stroke="#346E9D" stroke-width="3" marker-end="url(#main)"/>
<text x="45" y="389" font-size="24" fill="#243E56">I₁ = I₀/2，I₂ = I₁ cos²45°，I₃ = I₂ cos²45°。</text>
<text x="45" y="427" font-size="20" fill="#5E7488">不能把第一片和第三片的 90° 直接用于整个三片系统。</text>
</g></svg>