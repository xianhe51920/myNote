<text x="671.00" y="205.00" fill="#243E56" font-family="Microsoft YaHei, sans-serif" font-size="17" text-anchor="start" font-weight="normal">y = x</text>
<text x="505.00" y="363.00" fill="#243E56" font-family="Microsoft YaHei, sans-serif" font-size="16" text-anchor="start" font-weight="normal">0 ≤ x ≤ 1/2，x ≤ y ≤ 1 − x</text>
